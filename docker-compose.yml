services:
  db:
    image: postgres:16-alpine
    container_name: botplatform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: botadmin
      POSTGRES_PASSWORD: botpass
      POSTGRES_DB: botplatform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
